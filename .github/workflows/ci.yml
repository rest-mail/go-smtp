name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt'; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # Main CI measured 96.1% after #112 (run 39695295116). Enforce the
      # same 95% minimum as the shared RFC workflow used by other go-* libraries.
      # The README badge and TestReadmeBadges track FLOOR; COVERAGE.md records
      # the measurement and exclusions. The demo cmd/smtp-debug-server is omitted.
      - name: test (race) with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out . ./internal/...
      - name: coverage floor
        env:
          FLOOR: '95'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
          echo "Statement coverage: ${total}% (floor ${FLOOR}%)"
          awk -v t="$total" -v f="$FLOOR" 'BEGIN { exit !(t + 0 >= f + 0) }'
      - name: RFC checklist
        run: go run ./internal/checklist -file CHECKLIST.md .
      - name: fuzz parsers (10 seconds each)
        env:
          GOMAXPROCS: '1'
        run: |
          go test -run='^$' -fuzz='^FuzzRFC6710Priority$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzRFC3030Arguments$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzRFC3461Notify$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzDecodeSASLResponse$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzParseCmd$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzParseArgs$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzRFC6152DataOctets$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzRFC1870SizeValues$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzParseDeliverByArgument$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzParseReversePath$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzParseForwardPath$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzDecodeXtext$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzEncodeXtext$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzDecodeXClientValue$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzDecodeUTF8AddrXtext$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzEncodeUTF8AddrXtext$' -fuzztime=10s -parallel=1 .
          go test -run='^$' -fuzz='^FuzzEncodeUTF8AddrUnitext$' -fuzztime=10s -parallel=1 .
